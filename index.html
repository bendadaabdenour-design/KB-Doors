<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBDOOR | Portes WPC en Algérie</title>
</head>
<body>
  <p>Chargement de KBDOOR…</p>
  <script>
    const logoMarkup = `
      <div style="display:inline-flex;align-items:center;gap:10px;flex-shrink:0;">
        <div style="width:42px;height:42px;border-radius:50%;background:#1f1b18;border:2px solid #d4a63a;display:flex;align-items:center;justify-content:center;box-shadow:none;">
          <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo KBDOOR" style="display:block;">
            <defs>
              <linearGradient id="kbGold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f9df8f"/>
                <stop offset="0.5" stop-color="#d5a63e"/>
                <stop offset="1" stop-color="#8f6202"/>
              </linearGradient>
            </defs>
            <circle cx="12" cy="12" r="11" fill="#1f1b18" stroke="url(#kbGold)" stroke-width="1.5"/>
            <text x="12" y="15" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" font-weight="700" fill="url(#kbGold)">KB</text>
          </svg>
        </div>
        <div style="display:flex;flex-direction:column;line-height:1;">
          <span style="font-size:14px;font-weight:800;letter-spacing:-0.5px;color:#1c1917;">KBDOOR</span>
          <span style="font-size:8px;font-weight:700;letter-spacing:1px;color:#b45309;margin-top:2px;">DOORS ALGÉRIE</span>
        </div>
      </div>
    `;

    fetch('https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/aaf6e74a89c8d00df1b0fad9aa99767ea3005448/index.html')
      .then(response => {
        if (!response.ok) throw new Error('Impossible de charger le site.');
        return response.text();
      })
      .then(html => {
        const mapLink = '<a href="https://www.google.com/maps?q=36.65017786243297,2.997543609145038" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">Birtouta, Alger</a>';
        const updatedHtml = html
          .replaceAll('DZ-WPC', 'KBDOOR')
          .replaceAll('+213 (0) 550 12 34 56', '+213 796 05 18 01')
          .replaceAll('213550123456', '213796051801')
          .replaceAll('contact@dz-wpc.dz', 'pedrobrono@gmail.com')
          .replace('Usine et showroom basés à Rouiba, Alger.', `Usine et showroom basés à ${mapLink}.`)
          .replaceAll(
            'Zone Industrielle de Rouiba, Alger',
            '<a href="https://www.google.com/maps?q=36.65017786243297,2.997543609145038" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">بئر توتة, Birtouta, Algeria</a>'
          )
          .replace(
            '<p class="text-sm text-stone-400 mt-1">Email : pedrobrono@gmail.com</p>',
            '<p class="text-sm text-stone-400 mt-1">Email : <a href="mailto:pedrobrono@gmail.com" class="hover:text-amber-400 underline">pedrobrono@gmail.com</a></p>\n        <p class="text-sm text-stone-400 mt-1">YouTube : <a href="https://www.youtube.com/@pmbdari" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">@pmbdari</a></p>'
          );

        document.open();
        document.write(updatedHtml);
        document.close();

        setTimeout(() => {
          const brand = document.querySelector('header .flex.items-center.gap-2.cursor-pointer');
          if (brand) {
            brand.innerHTML = logoMarkup;
            brand.style.display = 'inline-flex';
            brand.style.alignItems = 'center';
            brand.style.gap = '10px';
            brand.style.flexShrink = '0';
            brand.style.cursor = 'pointer';
          }
        }, 200);
      })
      .catch(() => {
        document.body.textContent = 'Le site KBDOOR est temporairement indisponible. Veuillez réessayer.';
      });
  </script>
</body>
</html>
