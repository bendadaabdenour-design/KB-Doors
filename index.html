<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBDOOR | Portes WPC en Algérie</title>
</head>
<body>
  <p>Chargement de KBDOOR…</p>
  <script>
    const logoMarkup = `
      <div style="display:inline-flex;align-items:center;gap:10px;flex-shrink:0;">
        <div style="width:42px;height:42px;border-radius:50%;background:#1f1b18;border:2px solid #d4a63a;display:flex;align-items:center;justify-content:center;box-shadow:none;">
          <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo KBDOOR" style="display:block;">
            <defs>
              <linearGradient id="kbGold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f9df8f"/>
                <stop offset="0.5" stop-color="#d5a63e"/>
                <stop offset="1" stop-color="#8f6202"/>
              </linearGradient>
            </defs>
            <circle cx="12" cy="12" r="11" fill="#1f1b18" stroke="url(#kbGold)" stroke-width="1.5"/>
            <text x="12" y="15" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" font-weight="700" fill="url(#kbGold)">KB</text>
          </svg>
        </div>
        <div style="display:flex;flex-direction:column;line-height:1;">
          <span style="font-size:14px;font-weight:800;letter-spacing:-0.5px;color:#1c1917;">KBDOOR</span>
          <span style="font-size:8px;font-weight:700;letter-spacing:1px;color:#b45309;margin-top:2px;">DOORS ALGÉRIE</span>
        </div>
      </div>
    `;

    fetch('https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/aaf6e74a89c8d00df1b0fad9aa99767ea3005448/index.html')
      .then(response => {
        if (!response.ok) throw new Error('Impossible de charger le site.');
        return response.text();
      })
      .then(html => {
        const mapLink = '<a href="https://www.google.com/maps?q=36.65017786243297,2.997543609145038" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">Birtouta, Alger</a>';
        let updatedHtml = html
          .replace(/ROUIBA/gi, 'BIRTOUTA')
          .replace(/Rouiba/gi, 'BIRTOUTA')
          .replaceAll('DZ-WPC', 'KBDOOR')
          .replaceAll('+213 (0) 550 12 34 56', '+213 796 05 18 01')
          .replaceAll('213550123456', '213796051801')
          .replaceAll('contact@dz-wpc.dz', 'pedrobrono@gmail.com')
          .replace('Usine et showroom basés à Rouiba, Alger.', `Usine et showroom basés à ${mapLink}.`)
          .replaceAll(
            'Zone Industrielle de Rouiba, Alger',
            '<a href="https://www.google.com/maps?q=36.65017786243297,2.997543609145038" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">بئر توتة, BIRTOUTA, Algérie</a>'
          )
          .replace(
            '<p class="text-sm text-stone-400 mt-1">Email : pedrobrono@gmail.com</p>',
            '<p class="text-sm text-stone-400 mt-1">Email : <a href="mailto:pedrobrono@gmail.com" class="hover:text-amber-400 underline">pedrobrono@gmail.com</a></p>\n        <p class="text-sm text-stone-400 mt-1">WhatsApp : <a href="https://wa.me/213796051801" class="hover:text-amber-400 underline">+213 796 05 18 01</a></p>'
          );

        const sizeConfigurator = `
          (function () {
            function installDoorSizeSliders() {
              if (typeof state === 'undefined' || state.page !== 'configurator') return;
              const heading = [...document.querySelectorAll('#app-content label')]
                .find(label => label.textContent.includes('Dimensions (Largeur x Hauteur)'));
              if (!heading || document.getElementById('custom-door-size')) return;

              const match = state.config.dimension.label.match(/(\d+)\s*x\s*(\d+)/i);
              const width = Number(state.config.width || (match && match[1]) || 83);
              const height = Number(state.config.height || (match && match[2]) || 204);
              state.config.width = width;
              state.config.height = height;

              const panel = document.createElement('div');
              panel.id = 'custom-door-size';
              panel.className = 'mt-4 p-4 rounded-xl border border-amber-200 bg-amber-50 space-y-4';
              panel.innerHTML = ` + '`' + `
                <p class="text-sm font-bold text-stone-900">Dimensions sur mesure</p>
                <div>
                  <div class="flex justify-between text-xs font-semibold mb-1"><label for="door-width">Largeur</label><output id="door-width-value">${width} cm</output></div>
                  <input id="door-width" type="range" min="60" max="120" step="1" value="${width}" class="w-full accent-amber-600" aria-label="Largeur de la porte en centimètres">
                </div>
                <div>
                  <div class="flex justify-between text-xs font-semibold mb-1"><label for="door-height">Hauteur</label><output id="door-height-value">${height} cm</output></div>
                  <input id="door-height" type="range" min="180" max="240" step="1" value="${height}" class="w-full accent-amber-600" aria-label="Hauteur de la porte en centimètres">
                </div>
                <p class="text-xs text-stone-600">Déplacez les curseurs pour ajuster la porte. Le tarif des dimensions personnalisées sera confirmé sur devis.</p>
              ` + '`' + `;
              heading.parentElement.appendChild(panel);

              function updateSize() {
                const nextWidth = Number(document.getElementById('door-width').value);
                const nextHeight = Number(document.getElementById('door-height').value);
                document.getElementById('door-width-value').value = nextWidth + ' cm';
                document.getElementById('door-height-value').value = nextHeight + ' cm';
                state.config.width = nextWidth;
                state.config.height = nextHeight;
                state.config.dimension = {
                  label: nextWidth + ' x ' + nextHeight + ' cm (Sur mesure)',
                  price: 0
                };
                render();
              }

              panel.querySelector('#door-width').addEventListener('input', updateSize);
              panel.querySelector('#door-height').addEventListener('input', updateSize);

              const preview = document.querySelector('#app-content svg.drop-shadow-xl');
              if (preview) {
                preview.setAttribute('width', Math.round(200 * width / 83));
                preview.setAttribute('height', Math.round(350 * height / 204));
              }
            }

            const observer = new MutationObserver(installDoorSizeSliders);
            observer.observe(document.getElementById('app-content'), { childList: true, subtree: true });
            installDoorSizeSliders();
          })();
        `;

        updatedHtml = updatedHtml.replace(
          '</body>',
          '<script>' + sizeConfigurator + '</scr' + 'ipt></body>'
        );

        document.open();
        document.write(updatedHtml);
        document.close();

        setTimeout(() => {
          const brand = document.querySelector('header .flex.items-center.gap-2.cursor-pointer');
          if (brand) {
            brand.innerHTML = logoMarkup;
            brand.style.display = 'inline-flex';
            brand.style.alignItems = 'center';
            brand.style.gap = '10px';
            brand.style.flexShrink = '0';
            brand.style.cursor = 'pointer';
          }
        }, 200);
      })
      .catch(() => {
        document.body.textContent = 'Le site KBDOOR est temporairement indisponible. Veuillez réessayer.';
      });
  </script>
</body>
</html>
