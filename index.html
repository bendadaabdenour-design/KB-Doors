<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-version" content="1.0.0" />
  <title>KBDOOR | Portes WPC en Algérie</title>
  <script src="./supabase-config.js"></script>
</head>
<body>
  <p style="font-family: sans-serif; padding: 2rem;">Chargement de KBDOOR…</p>
  <script>
    (async function loadSite() {
      const sourceUrl = 'https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/aaf6e74a89c8d00df1b0fad9aa99767ea3005448/index.html';

      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        let html = await response.text();
        if (!html.includes('id="app-content"') || !html.includes('function render()')) {
          throw new Error('Le fichier de l’application est incomplet.');
        }

        html = html
          .replace("Fabricant algérien spécialisé dans les portes d'intérieur en composite bois-polymère (WPC) haute résistance. Usine et showroom basés à Rouiba, Alger.", "Fabricant algérien spécialisé dans les portes d'intérieur en composite bois-polymère (WPC) haute résistance. Usine et showroom basés à BIRTOUTA, Alger.")
          .replace("Usine et showroom basés à BIRTOUTA, Alger.", 'Usine et showroom basés à <a href="https://maps.app.goo.gl/iTtm4vZfanYV4fM18" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">BIRTOUTA, Alger</a>.')
          .replace('Zone Industrielle de Rouiba, Alger', '<a href="https://maps.app.goo.gl/iTtm4vZfanYV4fM18" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">Zone Industrielle de BIRTOUTA, Alger</a>')
          .replace('+213 (0) 550 12 34 56', '<a href="tel:+33669091152" class="hover:text-amber-400 underline">0033669091152</a>')
          .replace('contact@dz-wpc.dz', '<a href="mailto:bendadaabdenour@gmail.com" class="hover:text-amber-400 underline">bendadaabdenour@gmail.com</a>')
          .replace(/ROUIBA/gi, 'BIRTOUTA')
          .replaceAll('DZ-WPC', 'KBDOOR')
          .replaceAll('213550123456', '33669091152')
          .replace('<button onclick="navigate(\'contact\')" class="nav-link hover:text-amber-700 transition" data-page="contact">Contact & Devis</button>', '<button onclick="navigate(\'contact\')" class="nav-link hover:text-amber-700 transition" data-page="contact">Contact & Devis</button>\n        <button onclick="navigate(\'tracking\')" class="nav-link hover:text-amber-700 transition" data-page="tracking">Suivre ma commande</button>')
          .replace('<button onclick="navigate(\'contact\'); toggleMobileMenu()" class="block w-full text-left py-2 font-medium text-stone-700">Contact & Devis</button>', '<button onclick="navigate(\'contact\'); toggleMobileMenu()" class="block w-full text-left py-2 font-medium text-stone-700">Contact & Devis</button>\n      <button onclick="navigate(\'tracking\'); toggleMobileMenu()" class="block w-full text-left py-2 font-medium text-stone-700">Suivre ma commande</button>')
          .replace('<li><button onclick="navigate(\'contact\')" class="hover:text-amber-400">Demander un devis</button></li>', '<li><button onclick="navigate(\'contact\')" class="hover:text-amber-400">Demander un devis</button></li>\n          <li><button onclick="navigate(\'tracking\')" class="hover:text-amber-400">Suivre ma commande</button></li>')
          .replace('const SUPABASE_URL = "";', 'const SUPABASE_URL = window.KBDOOR_SUPABASE_CONFIG?.url || "";')
          .replace('const SUPABASE_ANON_KEY = "";', 'const SUPABASE_ANON_KEY = window.KBDOOR_SUPABASE_CONFIG?.anonKey || "";')
          .replace("SUPABASE_URL ? 'Connecté à Supabase' : 'Stockage local actif'", "SUPABASE_URL && SUPABASE_ANON_KEY ? 'Connecté à Supabase' : 'Stockage local actif'")
          .replace('await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {', "const isOrder = table === 'commandes'; const endpoint = isOrder ? '/rest/v1/rpc/enregistrer_commande' : '/rest/v1/' + table; const response = await fetch(SUPABASE_URL + endpoint, {")
          .replace('body: JSON.stringify(payload)\n        });', "body: JSON.stringify(table === 'commandes' ? { p_order: payload } : payload)\n        });\n        if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + await response.text());")
          .replace('catch (e) { console.error("Erreur Supabase:", e); }', 'catch (e) { console.error("Erreur Supabase:", e); if (table === "commandes") throw e; }')
          .replace("await saveToSupabase('commandes', orderRecord);", "try {\n        await saveToSupabase('commandes', orderRecord);\n      } catch (error) {\n        document.getElementById('app-content').innerHTML = '<div class=\"max-w-xl mx-auto px-4 py-20 text-center\"><h1 class=\"text-2xl font-bold text-red-700 mb-3\">Commande non confirmée</h1><p class=\"text-stone-700\">La commande ' + orderRecord.id + ' n’a pas pu être enregistrée dans notre base. Réessayez ou contactez-nous au <a href=\"tel:+33669091152\" class=\"font-semibold text-amber-700 underline\">0033669091152</a>.</p></div>';\n        return;\n      }")
          .replace(/<button onclick="navigate\('admin'\)"[^>]*>Espace Administrateur<\/button>\s*/, '')
          .replace("payment: state.paymentMethod,\n        total: formatDA(totalAmount),", "payment: state.paymentMethod,\n        status: 'Commande reçue - en attente de confirmation',\n        total: formatDA(totalAmount),")
          .replace("else if (state.page === 'contact') container.innerHTML = renderContact();", "else if (state.page === 'contact') container.innerHTML = renderContact();\n      else if (state.page === 'tracking') container.innerHTML = renderOrderTracking();");

        const trackingEnhancements = `
          <script>
            function renderOrderTracking() {
              return '<div class="max-w-2xl mx-auto px-4 sm:px-6 py-12 fade-in">' +
                '<h1 class="text-3xl font-bold text-stone-900 mb-3">Suivre ma commande</h1>' +
                '<p class="text-stone-600 mb-8">Saisissez le numéro de commande et le téléphone utilisés lors de votre achat.</p>' +
                '<form onsubmit="return trackOrder(event)" class="rounded-2xl border border-stone-200 bg-white p-6 sm:p-8 shadow-sm space-y-5">' +
                  '<div><label for="tracking-order-id" class="mb-1 block text-sm font-semibold">Numéro de commande</label><input id="tracking-order-id" required class="w-full rounded-xl border border-stone-300 px-4 py-3 text-sm" placeholder="Ex. CMD-123456"></div>' +
                  '<div><label for="tracking-phone" class="mb-1 block text-sm font-semibold">Téléphone de la commande</label><input id="tracking-phone" type="tel" required class="w-full rounded-xl border border-stone-300 px-4 py-3 text-sm" placeholder="Numéro complet utilisé pour la commande"><p class="mt-1 text-xs text-stone-500">Saisissez le numéro complet (au moins 8 chiffres), pas seulement l’indicatif.</p></div>' +
                  '<button type="submit" class="w-full rounded-xl bg-amber-700 px-4 py-3 font-bold text-white hover:bg-amber-600">Consulter le statut</button>' +
                  '<div id="tracking-result" role="status" aria-live="polite"></div>' +
                '</form>' +
                '<p class="mt-5 text-sm text-stone-500">' +
                  (window.KBDOOR_SUPABASE_CONFIG && window.KBDOOR_SUPABASE_CONFIG.url && window.KBDOOR_SUPABASE_CONFIG.anonKey
                    ? 'Le suivi consulte le statut enregistré dans notre base de données.'
                    : 'Le suivi en ligne est indisponible. Contactez-nous au <a href="tel:+33669091152" class="font-semibold text-amber-700 underline">0033669091152</a>.') +
                '</p>' +
              '</div>';
            }

            function trackOrder(event) {
              event.preventDefault();
              const result = document.getElementById('tracking-result');
              result.replaceChildren();

              const orderId = document.getElementById('tracking-order-id').value.trim().toUpperCase();
              const phone = normalizeTrackingPhone(document.getElementById('tracking-phone').value);
              if (phone.length < 8) {
                result.textContent = 'Saisissez le numéro de téléphone complet utilisé lors de la commande (au moins 8 chiffres).';
                return false;
              }

              const config = window.KBDOOR_SUPABASE_CONFIG;
              if (config && config.url && config.anonKey) {
                result.textContent = 'Recherche de votre commande…';
                lookupOrderStatus(orderId, phone, result, config);
                return false;
              }

              let orders;
              try {
                orders = JSON.parse(localStorage.getItem('dz_wpc_orders') || '[]');
              } catch (error) {
                result.textContent = 'Impossible de lire les commandes enregistrées sur cet appareil.';
                return false;
              }
              if (!Array.isArray(orders)) {
                result.textContent = 'Les données locales des commandes sont invalides.';
                return false;
              }

              const order = orders.find(item =>
                String(item.id || '').trim().toUpperCase() === orderId &&
                String(item.phone || '').replace(/[^0-9]/g, '') === phone
              );
              if (!order) {
                result.textContent = 'Commande introuvable. Vérifiez le numéro de commande et le téléphone saisis.';
                return false;
              }
              displayOrderStatus(result, order);
              return false;
            }

            function normalizeTrackingPhone(value) {
              return value.replace(/[^0-9]/g, '').replace(/^(?:00213|213)/, '0');
            }

            async function lookupOrderStatus(orderId, phone, result, config) {
              try {
                const response = await fetch(config.url.replace(/\\/$/, '') + '/rest/v1/rpc/suivre_commande', {
                  method: 'POST',
                  headers: {
                    apikey: config.anonKey,
                    Authorization: 'Bearer ' + config.anonKey,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ p_id: orderId, p_phone: phone })
                });
                if (!response.ok) {
                  const error = new Error('HTTP ' + response.status + ': ' + await response.text());
                  error.status = response.status;
                  throw error;
                }

                const orders = await response.json();
                if (!Array.isArray(orders)) throw new Error('Réponse de suivi invalide.');
                if (orders.length === 0) {
                  result.textContent = 'Aucune commande ne correspond à ces informations dans la base. Vérifiez le numéro et le téléphone. Si la commande est visible uniquement sur cet appareil, contactez-nous pour confirmer son enregistrement.';
                  return;
                }
                displayOrderStatus(result, orders[0]);
              } catch (error) {
                console.error('Échec de la recherche de commande :', error);
                if (error.status === 404) {
                  result.textContent = 'La fonction de suivi n’est pas installée dans Supabase. Exécutez supabase/tracking.sql dans SQL Editor, puis réessayez.';
                } else if (error.status === 401 || error.status === 403) {
                  result.textContent = 'Supabase a refusé la consultation. Vérifiez la clé publique et les droits de la fonction suivre_commande.';
                } else {
                  result.textContent = 'Le suivi est indisponible (HTTP ' + (error.status || 'réseau') + '). Vérifiez que supabase/tracking.sql a été exécuté, puis réessayez.';
                }
              }
            }

            function displayOrderStatus(result, order) {
              result.replaceChildren();
              const card = document.createElement('div');
              card.className = 'mt-2 rounded-xl border border-stone-200 bg-white p-5 text-stone-900';
              const reference = document.createElement('p');
              reference.className = 'font-semibold';
              reference.textContent = 'Commande ' + order.id;
              const status = document.createElement('p');
              const currentStatus = order.status || 'Commande reçue - en attente de confirmation';
              status.className = 'mt-1 text-sm font-semibold ' + (currentStatus === 'Annulée' ? 'text-red-700' : 'text-emerald-800');
              status.textContent = 'Statut actuel : ' + currentStatus;
              card.append(reference, status);

              const steps = [
                'Commande reçue - en attente de confirmation',
                'Confirmée',
                'En préparation',
                'Expédiée',
                'Livrée'
              ];
              if (currentStatus === 'Annulée') {
                const note = document.createElement('p');
                note.className = 'mt-3 rounded-lg bg-red-50 p-3 text-sm text-red-800';
                note.textContent = 'Cette commande a été annulée. Contactez-nous si vous souhaitez plus d’informations.';
                card.appendChild(note);
              }

              const currentStep = steps.indexOf(currentStatus);
              const list = document.createElement('ol');
              list.className = 'mt-6 grid grid-cols-2 gap-x-3 gap-y-5 sm:grid-cols-5';
              list.setAttribute('aria-label', 'Étapes de la commande');
              steps.forEach(function (step, index) {
                const item = document.createElement('li');
                item.className = 'relative flex flex-col items-center gap-2 text-center text-xs sm:text-sm';
                if (index < steps.length - 1) {
                  const connector = document.createElement('span');
                  connector.setAttribute('aria-hidden', 'true');
                  connector.className = 'absolute left-[calc(50%+14px)] top-3 hidden h-0.5 w-[calc(100%-4px)] sm:block ' +
                    (currentStep > index ? 'bg-emerald-500' : 'bg-stone-200');
                  item.appendChild(connector);
                }
                const marker = document.createElement('span');
                const isComplete = currentStep >= 0 && index < currentStep;
                const isCurrent = currentStep === index;
                marker.className = 'relative z-10 flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-bold ' +
                  (isComplete ? 'bg-emerald-600 text-white' : isCurrent ? 'bg-amber-700 text-white' : 'bg-stone-200 text-stone-500');
                marker.textContent = isComplete ? '✓' : String(index + 1);
                const label = document.createElement('span');
                label.className = isComplete || isCurrent ? 'font-semibold text-stone-900' : 'text-stone-500';
                label.textContent = step + (isCurrent ? ' (actuelle)' : '');
                item.append(marker, label);
                list.appendChild(item);
              });
              card.appendChild(list);
              result.appendChild(card);
            }
          <\/script>
        `;

        html = html.replace('</body>', trackingEnhancements + '\n</body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('Échec du chargement de KBDOOR :', error);
        document.body.innerHTML = '<main style="max-width:38rem;margin:4rem auto;padding:1.5rem;font:16px/1.5 sans-serif;color:#292524"><h1>Le site KBDOOR n’a pas pu être chargé.</h1><p>Vérifiez votre connexion Internet puis actualisez la page.</p></main>';
      }
    })();
  </script>
</body>
</html>
