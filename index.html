<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBDOOR | Portes WPC en Algérie</title>
</head>
<body>
  <p>Chargement de KBDOOR…</p>
  <script>
    const logoMarkup = `
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <svg width="42" height="42" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo KBDOOR" style="display:block;flex:none;">
          <defs>
            <linearGradient id="logoGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f9df8f"/>
              <stop offset="0.5" stop-color="#d5a63e"/>
              <stop offset="1" stop-color="#8f6202"/>
            </linearGradient>
          </defs>
          <circle cx="24" cy="24" r="22" fill="#292524" stroke="url(#logoGold)" stroke-width="2.5"/>
          <text x="24" y="29" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="url(#logoGold)">KB</text>
          <circle cx="24" cy="34" r="1.5" fill="#f9df8f"/>
        </svg>
        <span style="display:flex;flex-direction:column;line-height:1.05;">
          <span style="font-size:16px;font-weight:700;letter-spacing:-.3px;color:#1c1917;">KBDOOR</span>
          <span style="font-size:9px;font-weight:600;letter-spacing:.6px;color:#b45309;margin-top:3px;">DOORS ALGÉRIE</span>
        </span>
      </div>
    `;

    fetch('https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/aaf6e74a89c8d00df1b0fad9aa99767ea3005448/index.html')
      .then(response => {
        if (!response.ok) throw new Error('Impossible de charger le site.');
        return response.text();
      })
      .then(html => {
        const updatedHtml = html
          .replaceAll('DZ-WPC', 'KBDOOR')
          .replaceAll('+213 (0) 550 12 34 56', '+213 796 05 18 01')
          .replaceAll('213550123456', '213796051801')
          .replaceAll('contact@dz-wpc.dz', 'pedrobrono@gmail.com')
          .replaceAll(
            'Zone Industrielle de Rouiba, Alger',
            '<a href="https://www.google.com/maps?q=36.65017786243297,2.997543609145038" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">بئر توتة, Birtouta, Algeria</a>'
          )
          .replace(
            '<p class="text-sm text-stone-400 mt-1">Email : pedrobrono@gmail.com</p>',
            '<p class="text-sm text-stone-400 mt-1">Email : <a href="mailto:pedrobrono@gmail.com" class="hover:text-amber-400 underline">pedrobrono@gmail.com</a></p>\n        <p class="text-sm text-stone-400 mt-1">YouTube : <a href="https://www.youtube.com/@pmbdari" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">@pmbdari</a></p>'
          );

        document.open();
        document.write(updatedHtml);
        document.close();

        setTimeout(() => {
          const brand = document.querySelector('header .flex.items-center.gap-2.cursor-pointer');
          if (brand) {
            brand.innerHTML = logoMarkup;
            brand.style.cssText = 'display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;';
          }
        }, 100);
      })
      .catch(() => {
        document.body.textContent = 'Le site KBDOOR est temporairement indisponible. Veuillez réessayer.';
      });
  </script>
</body>
</html>
