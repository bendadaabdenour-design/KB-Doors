<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBDOOR | Portes WPC en Algérie</title>
</head>
<body>
  <p style="font-family: sans-serif; padding: 2rem;">Chargement de KBDOOR…</p>
  <script>
    (async function loadSite() {
      const sourceUrl = 'https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/aaf6e74a89c8d00df1b0fad9aa99767ea3005448/index.html';
      const m2ImageUrl = 'https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/main/images/m2.webp';

      function ensureM2CatalogModel() {
        const app = document.getElementById('app-content');
        if (!app) return;

        const catalogSection = Array.from(app.querySelectorAll('div.max-w-7xl')).find(function (section) {
          return section.textContent.includes('Catalogue des Portes WPC');
        });
        if (!catalogSection) return;

        const grid = catalogSection.querySelector('div.grid');
        if (!grid || catalogSection.querySelector('[data-m2-catalog-model="true"]')) return;

        const model = document.createElement('article');
        model.setAttribute('data-m2-catalog-model', 'true');
        model.className = 'mb-8 overflow-hidden rounded-3xl border border-stone-200 bg-white shadow-sm';
        model.innerHTML = `
          <img src="${m2ImageUrl}" alt="Modèle de porte M2" class="w-full h-64 sm:h-80 object-cover" style="display:block;" />
          <div class="flex flex-wrap items-center justify-between gap-3 p-4 bg-white">
            <div>
              <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-amber-700">Nouveau modèle</p>
              <h2 class="text-xl font-bold text-stone-900">Modèle M2</h2>
            </div>
            <button type="button" class="px-4 py-2 rounded-xl bg-stone-900 text-white text-sm font-semibold" onclick="state.prefillContact = 'Bonjour, je souhaite un devis pour le modèle M2.'; navigate('contact');">
              Demander un devis
            </button>
          </div>
        `;

        catalogSection.insertBefore(model, grid);
      }

      const sizeConfiguratorCode = `
        (function installCustomDoorSizeControls() {
          function installControls() {
            if (typeof state === 'undefined' || state.page !== 'configurator') return;
            const heading = Array.from(document.querySelectorAll('#app-content label'))
              .find(function (label) { return /dimensions/i.test(label.textContent); });
            if (!heading || document.getElementById('custom-door-size')) return;

            const currentDimension = state.config.dimension.label.match(/(\\d+)\\s*x\\s*(\\d+)/i);
            const width = Number(state.config.width || (currentDimension && currentDimension[1]) || 83);
            const height = Number(state.config.height || (currentDimension && currentDimension[2]) || 204);
            state.config.width = width;
            state.config.height = height;

            const panel = document.createElement('div');
            panel.id = 'custom-door-size';
            panel.className = 'mt-4 p-4 rounded-xl border border-amber-200 bg-amber-50 space-y-4';
            panel.innerHTML =
              '<p class="text-sm font-bold text-stone-900">Dimensions sur mesure</p>' +
              '<div><div class="flex justify-between text-xs font-semibold mb-1"><label for="door-width">Largeur</label><output id="door-width-value">' + width + ' cm</output></div>' +
              '<input id="door-width" type="range" min="60" max="120" step="1" value="' + width + '" class="w-full accent-amber-600" aria-label="Largeur en centimètres"></div>' +
              '<div><div class="flex justify-between text-xs font-semibold mb-1"><label for="door-height">Hauteur</label><output id="door-height-value">' + height + ' cm</output></div>' +
              '<input id="door-height" type="range" min="180" max="240" step="1" value="' + height + '" class="w-full accent-amber-600" aria-label="Hauteur en centimètres"></div>' +
              '<p class="text-xs text-stone-600">Le tarif des dimensions sur mesure sera confirmé sur devis.</p>';
            heading.parentElement.appendChild(panel);

            function updateSize() {
              const widthInput = document.getElementById('door-width');
              const heightInput = document.getElementById('door-height');
              if (!widthInput || !heightInput) return;
              const nextWidth = Number(widthInput.value);
              const nextHeight = Number(heightInput.value);
              document.getElementById('door-width-value').textContent = nextWidth + ' cm';
              document.getElementById('door-height-value').textContent = nextHeight + ' cm';
              state.config.width = nextWidth;
              state.config.height = nextHeight;
              state.config.dimension = { label: nextWidth + ' x ' + nextHeight + ' cm (Sur mesure)', price: 0 };
              const preview = document.querySelector('#app-content svg.drop-shadow-xl');
              if (preview) {
                preview.setAttribute('width', Math.round(200 * nextWidth / 83));
                preview.setAttribute('height', Math.round(350 * nextHeight / 204));
              }
              const summary = Array.from(document.querySelectorAll('#app-content p'))
                .find(function (item) { return item.textContent.trim().startsWith('Dimensions :'); });
              if (summary) summary.innerHTML = '<strong>Dimensions :</strong> ' + state.config.dimension.label;
            }

            panel.querySelector('#door-width').addEventListener('input', updateSize);
            panel.querySelector('#door-height').addEventListener('input', updateSize);
            panel.querySelector('#door-width').addEventListener('change', render);
            panel.querySelector('#door-height').addEventListener('change', render);
            updateSize();
          }

          const app = document.getElementById('app-content');
          if (!app) return;
          new MutationObserver(installControls).observe(app, { childList: true, subtree: true });
          installControls();
        })();
      `;

      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        let html = await response.text();
        if (!html.includes('id="app-content"') || !html.includes('function render()')) {
          throw new Error('Le fichier source reçu est incomplet.');
        }

        html = html
          .replace(/ROUIBA/gi, 'BIRTOUTA')
          .replaceAll('DZ-WPC', 'KBDOOR')
          .replaceAll('+213 (0) 550 12 34 56', '+213 796 05 18 01')
          .replaceAll('213550123456', '213796051801')
          .replaceAll('contact@dz-wpc.dz', 'pedrobrono@gmail.com');

        const renderEnd = html.lastIndexOf('    render();');
        if (renderEnd < 0) throw new Error('Point d’insertion du configurateur introuvable.');
        const renderLineEnd = renderEnd + '    render();'.length;
        html = html.slice(0, renderLineEnd) + '\n' + sizeConfiguratorCode + html.slice(renderLineEnd);

        document.open();
        document.write(html);
        document.close();

        setTimeout(ensureM2CatalogModel, 250);
        const app = document.getElementById('app-content');
        if (app) {
          new MutationObserver(ensureM2CatalogModel).observe(app, { childList: true, subtree: true });
        }
      } catch (error) {
        console.error('Échec du chargement de KBDOOR :', error);
        document.body.innerHTML = `
          <main style="max-width: 38rem; margin: 4rem auto; padding: 1.5rem; font: 16px/1.5 sans-serif; color: #292524;">
            <h1>Le site KBDOOR n’a pas pu être chargé.</h1>
            <p>Vérifiez votre connexion, puis réessayez.</p>
            <button onclick="location.reload()" style="padding: .6rem 1rem; cursor: pointer;">Réessayer</button>
          </main>`;
      }
    })();
  </script>
</body>
</html>
