<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBDOOR | Portes WPC en Algérie</title>
</head>
<body>
  <p style="font-family: sans-serif; padding: 2rem;">Chargement de KBDOOR…</p>
  <script>
    (async function () {
      const sourceUrl = 'https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/aaf6e74a89c8d00df1b0fad9aa99767ea3005448/index.html';
      const raw = 'https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/main/';
      const customCode = `
        (function () {
          function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>\"']/g, function (char) {
              return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;' }[char];
            });
          }
          function itemSnapshot() {
            var product = state.selectedProduct || {};
            var config = state.config || {};
            var quantity = Math.max(1, Number(config.qty) || 1);
            var unitPrice = typeof calculateConfigTotal === 'function' ? calculateConfigTotal().unitPrice : (Number(product.basePrice) || 0);
            return {
              productId: product.id,
              productName: product.name || 'Article',
              category: product.category || '',
              style: product.style || '',
              color: config.color ? config.color.name : '',
              colorHex: config.color ? config.color.hex : '',
              colorPrice: config.color ? Number(config.color.price) || 0 : 0,
              dimension: config.dimension ? config.dimension.label : '',
              dimensionPrice: config.dimension ? Number(config.dimension.price) || 0 : 0,
              width: config.width || null,
              height: config.height || null,
              opening: config.opening || '',
              handle: config.handle || '',
              handlePrice: Number(config.handlePrice) || 0,
              frame: config.frame || '',
              framePrice: Number(config.framePrice) || 0,
              quantity: quantity,
              qty: quantity,
              unitPrice: unitPrice,
              lineTotal: unitPrice * quantity
            };
          }
          function itemDetails(item) {
            return '<li class="py-3 border-b border-stone-200 last:border-0">' +
              '<div class="font-bold">' + escapeHtml(item.productName) + ' — Quantité : ' + escapeHtml(item.quantity || item.qty || 1) + '</div>' +
              '<div class="text-sm text-stone-600 mt-1">Catégorie : ' + escapeHtml(item.category || '—') +
              ' | Coloris : ' + escapeHtml(item.color || '—') +
              ' | Dimensions : ' + escapeHtml(item.dimension || '—') +
              ' | Ouverture : ' + escapeHtml(item.opening || '—') + '</div>' +
              (item.handle ? '<div class="text-sm text-stone-600">Poignée : ' + escapeHtml(item.handle) + '</div>' : '') +
              (item.frame ? '<div class="text-sm text-stone-600">Cadre : ' + escapeHtml(item.frame) + '</div>' : '') +
              '<div class="text-sm font-semibold text-stone-800 mt-1">Prix unitaire : ' + escapeHtml(Number(item.unitPrice || 0).toLocaleString('fr-DZ')) + ' DA | Total ligne : ' + escapeHtml(Number(item.lineTotal || 0).toLocaleString('fr-DZ')) + ' DA</div></li>';
          }
          function detailsPanel(title, items, id) {
            if (!items || !items.length) return '';
            return '<section id="' + id + '" class="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-left">' +
              '<h3 class="font-bold text-stone-900 mb-2">' + title + '</h3><ul>' + items.map(itemDetails).join('') + '</ul></section>';
          }

          var originalAddToCart = addToCart;
          addToCart = function () {
            var details = itemSnapshot();
            originalAddToCart();
            var added = state.cart[state.cart.length - 1];
            if (added) Object.assign(added, details);
            saveCart();
            render();
          };

          var originalRequestQuote = requestCustomQuote;
          requestCustomQuote = function () {
            state.quoteItems = [itemSnapshot()];
            state.prefillContact = 'Demande de devis — ' + state.quoteItems.map(function (item) {
              return item.productName + ' | Quantité : ' + item.quantity + ' | Coloris : ' + item.color + ' | Dimensions : ' + item.dimension + ' | Ouverture : ' + item.opening + ' | Prix unitaire : ' + item.unitPrice + ' DA | Total : ' + item.lineTotal + ' DA';
            }).join('\\n');
            originalRequestQuote();
            setTimeout(function () {
              var field = document.getElementById('contact-msg');
              if (field && !field.value.trim()) field.value = state.prefillContact;
            }, 0);
          };

          var originalRenderContact = renderContact;
          renderContact = function () {
            var html = originalRenderContact();
            if (state.quoteItems && state.quoteItems.length) {
              html = html.replace('<div class="bg-white p-6 sm:p-8 rounded-2xl border border-stone-200 shadow-sm space-y-5">',
                '<div class="bg-white p-6 sm:p-8 rounded-2xl border border-stone-200 shadow-sm space-y-5">' + detailsPanel('Articles inclus dans votre demande de devis', state.quoteItems, 'quote-items-summary'));
            }
            return html;
          };

          var originalSaveToSupabase = saveToSupabase;
          saveToSupabase = async function (table, payload) {
            if (table === 'demandes_contact' && state.quoteItems && state.quoteItems.length) {
              payload = Object.assign({}, payload, { items: state.quoteItems });
            }
            return originalSaveToSupabase(table, payload);
          };

          var originalSubmitContact = submitContact;
          submitContact = async function () {
            var quoteItems = (state.quoteItems || []).map(function (item) { return Object.assign({}, item); });
            if (quoteItems.length) {
              var field = document.getElementById('contact-msg');
              var summary = quoteItems.map(function (item) {
                return item.productName + ' | Quantité : ' + item.quantity + ' | Coloris : ' + item.color + ' | Dimensions : ' + item.dimension + ' | Ouverture : ' + item.opening + ' | Poignée : ' + item.handle + ' | Cadre : ' + item.frame + ' | Prix unitaire : ' + item.unitPrice + ' DA | Total : ' + item.lineTotal + ' DA';
              }).join('\\n');
              if (field && !field.value.includes(item.productName)) field.value = (field.value ? field.value + '\\n\\n' : '') + summary;
            }
            await originalSubmitContact();
            if (quoteItems.length) {
              var leads = JSON.parse(localStorage.getItem('dz_wpc_leads') || '[]');
              if (leads.length) { leads[0].items = quoteItems; localStorage.setItem('dz_wpc_leads', JSON.stringify(leads)); }
            }
          };

          var originalSubmitOrder = submitOrder;
          submitOrder = async function (totalAmount) {
            var orderedItems = (state.cart || []).map(function (item) {
              var saved = Object.assign({}, item);
              if (!saved.quantity) saved.quantity = saved.qty || 1;
              if (!saved.lineTotal) saved.lineTotal = (Number(saved.unitPrice) || 0) * saved.quantity;
              return saved;
            });
            await originalSubmitOrder(totalAmount);
            if (orderedItems.length) {
              var orders = JSON.parse(localStorage.getItem('dz_wpc_orders') || '[]');
              if (orders.length) { orders[0].items = orderedItems; localStorage.setItem('dz_wpc_orders', JSON.stringify(orders)); }
              var app = document.getElementById('app-content');
              if (app) app.insertAdjacentHTML('beforeend', detailsPanel('Détail des articles commandés', orderedItems, 'order-items-summary'));
            }
          };

          var originalRenderAdmin = renderAdmin;
          renderAdmin = function () {
            var html = originalRenderAdmin();
            return html.replace(/(Commandes reçues[\\s\\S]*?<\\/h2>)/, '$1');
          };

          function replacePhoto(container, url, alt, variant) {
            if (!container) return;
            var preview = container.querySelector('svg.drop-shadow-xl');
            if (!preview) return;
            var image = document.createElement('img');
            image.src = url;
            image.alt = alt;
            image.className = 'mx-auto object-contain';
            image.width = Number(preview.getAttribute('width')) || 180;
            image.height = Number(preview.getAttribute('height')) || 320;
            image.style.width = Math.min(image.width, 320) + 'px';
            image.style.height = Math.min(image.height, 450) + 'px';
            image.loading = 'lazy';
            image.onerror = function () { this.onerror = null; this.src = raw + 'logo.jpg'; };
            var frame = document.createElement('div');
            frame.className = 'atlas-photo-frame ' + (variant || '');
            preview.replaceWith(frame);
            frame.appendChild(image);
          }
          function updatePhotos() {
            var app = document.getElementById('app-content');
            if (!app) return;
            Array.from(app.querySelectorAll('h3')).forEach(function (heading) {
              var card = heading.closest('.bg-white.rounded-2xl');
              if (heading.textContent.trim() === 'Porte WPC Atlas Moderne') replacePhoto(card, raw + 'image/m2.WEBP', heading.textContent, 'atlas-product-frame');
              if (heading.textContent.trim() === 'Porte WPC Sahara Classique') replacePhoto(card, raw + 'image/m1.WEBP', heading.textContent, '');
            });
            Array.from(app.querySelectorAll('p')).forEach(function (caption) {
              if (caption.textContent.includes('Modèle Atlas Moderne')) replacePhoto(caption.parentElement, raw + 'image/m2.WEBP', 'Porte WPC Atlas Moderne', 'atlas-home-frame');
              if (caption.textContent.includes('Modèle Sahara Classique')) replacePhoto(caption.parentElement, raw + 'image/m1.WEBP', 'Porte WPC Sahara Classique', '');
            });
            var title = Array.from(app.querySelectorAll('h1')).find(function (heading) { return heading.textContent.includes('Porte WPC Atlas Moderne'); });
            if (title) replacePhoto(title.closest('.max-w-7xl').querySelector('.lg\\:col-span-5'), raw + 'image/m2.WEBP', title.textContent, 'atlas-config-frame');
          }
          var app = document.getElementById('app-content');
          if (app) new MutationObserver(updatePhotos).observe(app, { childList: true, subtree: true });
          updatePhotos();
        })();
      `;

      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();
        if (!html.includes('id="app-content"') || !html.includes('function render()')) throw new Error('Le fichier source reçu est incomplet.');
        html = html
          .replace(/ROUIBA/gi, 'BIRTOUTA')
          .replace('Zone Industrielle de BIRTOUTA, Alger', '<a href="https://maps.app.goo.gl/UXCUg1bLVHbqtppz8" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 underline">Zone Industrielle de BIRTOUTA, Alger</a>')
          .replace('<div class="w-9 h-9 rounded-lg bg-amber-700 text-white flex items-center justify-center font-bold text-lg">DZ</div>', '<img src="' + raw + 'logo.jpg" alt="KBDOOR — Portes WPC" class="w-10 h-10 rounded-lg object-contain" width="40" height="40">')
          .replaceAll('DZ-WPC', 'KBDOOR')
          .replaceAll('+213 (0) 550 12 34 56', '+213 796 05 18 01')
          .replaceAll('213550123456', '213796051801')
          .replaceAll('contact@dz-wpc.dz', 'pedrobrono@gmail.com')
          .replace('</head>', '<style>.atlas-photo-frame{position:relative;display:flex;align-items:center;justify-content:center;min-height:250px;padding:2.25rem 1.25rem 1.25rem;overflow:hidden;border:1px solid rgba(180,143,91,.28);border-radius:1.25rem;background:radial-gradient(ellipse at 50% 38%,#fff,#f5f0e8 48%,#e9e1d5);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 45px rgba(41,29,24,.12)}.atlas-photo-frame:before{content:"ATLAS / DESIGN CONTEMPORAIN";position:absolute;top:.8rem;left:1rem;color:#80613d;font:700 9px/1.2 system-ui,sans-serif;letter-spacing:.16em}.atlas-photo-frame img{position:relative;z-index:1;display:block;max-width:100%;max-height:420px;object-fit:contain;filter:drop-shadow(0 18px 15px rgba(35,25,18,.24))}.atlas-home-frame{padding:2.5rem 1.5rem 1.25rem;background:radial-gradient(ellipse at 50% 45%,#51483d,#29241f 72%)}.atlas-home-frame:before{color:#e5c28e}.atlas-config-frame{min-height:420px}.atlas-product-frame{min-height:280px;border-radius:0;border-left:0;border-right:0;border-top:0;box-shadow:none}@media(max-width:640px){.atlas-photo-frame{min-height:230px;padding:2.1rem .75rem .75rem}.atlas-photo-frame img{max-height:320px}}</style></head>');
        const renderEnd = html.lastIndexOf('    render();');
        if (renderEnd < 0) throw new Error('Point d’insertion introuvable.');
        const end = renderEnd + '    render();'.length;
        html = html.slice(0, end) + '\n' + customCode + html.slice(end);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('Échec du chargement de KBDOOR :', error);
        document.body.innerHTML = '<main style="max-width:38rem;margin:4rem auto;padding:1.5rem;font:16px/1.5 sans-serif;color:#292524"><h1>Le site KBDOOR n’a pas pu être chargé.</h1><p>Vérifiez votre connexion, puis réessayez.</p><button onclick="location.reload()">Réessayer</button></main>';
      }
    })();
  </script>
</body>
</html>
