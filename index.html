<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBDOOR | Portes WPC en Algérie</title>
</head>
<body>
  <p style="font-family: sans-serif; padding: 2rem;">Chargement de KBDOOR…</p>
  <script>
    (async function () {
      const restoredVersion = 'https://raw.githubusercontent.com/bendadaabdenour-design/KB-Doors/93f9b15fd74ebd73348d37dcce0b7f4f67c3cbf2/index.html';
      try {
        const response = await fetch(restoredVersion, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const html = await response.text();
        if (!html.includes('configurator') || !html.includes('sizeConfiguratorCode')) {
          throw new Error('La version avec configurateur est incomplète.');
        }
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('Échec du chargement de KBDOOR :', error);
        document.body.innerHTML = '<main style="max-width:38rem;margin:4rem auto;padding:1.5rem;font:16px/1.5 sans-serif;color:#292524"><h1>Le site KBDOOR n’a pas pu être chargé.</h1><p>Vérifiez votre connexion, puis réessayez.</p><button onclick="location.reload()" style="padding:.6rem 1rem;cursor:pointer">Réessayer</button></main>';
      }
    })();
  </script>
</body>
</html>
